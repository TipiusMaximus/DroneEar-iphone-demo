<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1220" />
  <title>DroneEar v0.2a</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --text: #e8eefc;
      --muted: #8b9bb8;
      --clear: #3dd68c;
      --possible: #f5c542;
      --detected: #ff5d5d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
    h1 { font-size: 1.15rem; font-weight: 650; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; line-height: 1.35; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 140px; padding: 10px 16px; border-radius: 999px;
      font-weight: 700; letter-spacing: 0.08em; font-size: 0.95rem;
    }
    .CLEAR { background: #143528; color: var(--clear); }
    .POSSIBLE { background: #3a2f0d; color: var(--possible); }
    .DETECTED { background: #3a1212; color: var(--detected); }
    .row { display: flex; justify-content: space-between; gap: 12px; margin: 14px 0 8px; align-items: baseline; }
    .label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .val { font-variant-numeric: tabular-nums; font-weight: 600; }
    .meter { height: 12px; background: #1a2438; border-radius: 999px; overflow: hidden; }
    .meter > span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #3dd68c, #f5c542, #ff5d5d); }
    canvas { width: 100%; height: 140px; background: var(--card); border-radius: 14px; margin-top: 16px; }
    button {
      width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 14px;
      background: #3b82f6; color: white; font-size: 1.05rem; font-weight: 700;
    }
    button.stop { background: #4b5568; }
    .note { margin-top: 14px; color: var(--muted); font-size: 0.78rem; line-height: 1.4; }
    .err { color: var(--detected); font-size: 0.9rem; margin-top: 12px; }
    details.debug {
      margin-top: 16px; background: var(--card); border-radius: 14px; padding: 10px 14px;
    }
    details.debug summary { color: var(--muted); font-size: 0.82rem; cursor: pointer; }
    #dbg {
      margin: 10px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem; line-height: 1.45; color: #c5d4ee; white-space: pre;
    }
  </style>
</head>
<body>
  <h1>DroneEar v0.2a</h1>
  <p class="sub">iPhone-demo. 4096 näytteen rolling FFT + harmoni-hila. Score ei ole todennäköisyys. Ääni ei tallennu.</p>
  <div id="state" class="badge CLEAR">CLEAR</div>
  <div class="row"><span class="label">Drone score</span><span class="val" id="score">0</span></div>
  <div class="meter"><span id="bar"></span></div>
  <div class="row"><span class="label">best f0</span><span class="val" id="f0">—</span></div>
  <canvas id="spec" width="600" height="280"></canvas>
  <button id="btn" type="button">Käynnistä mikki</button>
  <p class="err" id="err" hidden></p>
  <details class="debug">
    <summary>Debug</summary>
    <pre id="dbg">ei käynnissä</pre>
  </details>
  <p class="note">Safari pyytää mikrofonin. Alle 60 Hz hylätään taajuustasossa. Pidä puhelin paikallaan. Tämä ei ole kenttävalmis ilmaisin.</p>
<script src="dsp.js"></script>
<script>
const D = DroneEarDSP;
const CFG = {
  fftSize: 4096,
  highpassHz: 60,
  possible: 0.55,
  detected: 0.72,
  detectedS: 2.0,
  clear: 0.45,
  clearS: 3.0,
  smooth: 0.35,
  nHarmonics: 6,
  f0: [60, 400],
  f0StepHz: 0,
  harmonicTolHz: 8,
  harmonicTolFrac: 0.04,
  hitMargin: 2.5,
  minHitPower: 1e-18,
  silenceRms: 8e-4,
  trackSeconds: 1.5,
  trackMinScore: 0.22,
  bands: { low: [60, 250], mid: [250, 2000], high: [2000, 8000] },
  candW: { energy: 0.35, consistency: 0.40, contrast: 0.25 },
  scoreW: { harmonic: 0.40, contrast: 0.20, consistency: 0.15, track: 0.15, band: 0.10 },
};

const WIN = D.hann(CFG.fftSize);
const ring = new D.RingBuffer(CFG.fftSize);
const tracker = new D.F0Tracker(CFG);
const persist = D.persistDefaults();

let lastT = 0, running = false, ctx = null, proc = null, stream = null, srcNode = null;
let lastDbg = null;

const el = {
  state: document.getElementById("state"),
  score: document.getElementById("score"),
  bar: document.getElementById("bar"),
  f0: document.getElementById("f0"),
  err: document.getElementById("err"),
  btn: document.getElementById("btn"),
  spec: document.getElementById("spec"),
  dbg: document.getElementById("dbg"),
};
const g = el.spec.getContext("2d");

function drawSpec(power, freqs, sr, targets) {
  const w = el.spec.width, h = el.spec.height;
  g.fillStyle = "#121a2b"; g.fillRect(0, 0, w, h);
  const nEnd = Math.min(power.length, Math.floor(power.length * 8000 / (sr / 2)));
  let start = 1;
  while (start < nEnd && freqs[start] < CFG.highpassHz) start++;
  let mx = 1e-18;
  for (let i = start; i < nEnd; i++) mx = Math.max(mx, power[i]);
  g.beginPath();
  g.strokeStyle = "#7dd3fc";
  g.lineWidth = 2;
  const span = Math.max(1, nEnd - 1 - start);
  for (let x = 0; x < w; x++) {
    const i = start + Math.floor((x / w) * span);
    const y = h - 8 - (Math.log10(1 + 9 * power[i] / mx) * (h - 16));
    if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();
  if (targets && targets.length) {
    g.strokeStyle = "rgba(245,197,66,0.85)";
    g.lineWidth = 1;
    const fStart = freqs[start], fEnd = freqs[nEnd - 1];
    for (const f of targets) {
      if (f < fStart || f > fEnd) continue;
      const x = ((f - fStart) / (fEnd - fStart)) * w;
      g.beginPath(); g.moveTo(x, 6); g.lineTo(x, h - 6); g.stroke();
    }
  }
}

function fmt(n, d) {
  if (!isFinite(n)) return "—";
  return Number(n).toFixed(d);
}

function renderDbg(d) {
  el.dbg.textContent =
    "sampleRate        " + d.sr + " Hz\n" +
    "FFT               " + CFG.fftSize + "\n" +
    "resolution        " + fmt(d.df, 2) + " Hz\n" +
    "RMS               " + fmt(d.rms, 4) + "\n" +
    "best f0           " + fmt(d.f0, 1) + " Hz\n" +
    "harmonic hits     " + d.hits + " / " + d.counted + "\n" +
    "consistency       " + fmt(d.cons, 2) + "\n" +
    "contrast          " + fmt(d.contrastDb, 1) + " dB\n" +
    "harmonic score    " + fmt(d.hScore, 2) + "\n" +
    "track stability   " + fmt(d.track, 2) + "\n" +
    "band L/M/H        " + fmt(d.l, 2) + " / " + fmt(d.m, 2) + " / " + fmt(d.h, 2) + "\n" +
    "raw score         " + fmt(d.raw, 2) + "\n" +
    "smoothed score    " + fmt(d.sm, 2) + "\n" +
    "state             " + d.state;
}

function analyzeReady(samples, sr, dt, now) {
  const spec = D.analyzeFrame(samples, sr, CFG, WIN);
  const L = spec.lattice;
  const track = tracker.update(now, L.f0, L.harmonicScore);
  const bandScore = D.mechanicalBandScore(spec.bandLowRatio, spec.bandMidRatio, spec.bandHighRatio);
  const raw = D.scoreFrame({
    harmonicScore: L.harmonicScore,
    harmonicContrast: L.harmonicContrast,
    harmonicConsistency: L.harmonicConsistency,
    trackStability: track,
    bandScore: bandScore,
  }, CFG, spec.rms);
  const snap = D.persistUpdate(persist, raw, dt, CFG);
  el.score.textContent = Math.round(snap.sm * 100);
  el.bar.style.width = (snap.sm * 100).toFixed(1) + "%";
  el.f0.textContent = L.f0 ? (L.f0.toFixed(0) + " Hz") : "—";
  el.state.textContent = snap.state;
  el.state.className = "badge " + snap.state;
  drawSpec(spec.power, spec.freqs, sr, L.targets);
  lastDbg = {
    sr, df: spec.df, rms: spec.rms, f0: L.f0,
    hits: L.harmonicHits, counted: L.harmonicCounted,
    cons: L.harmonicConsistency, contrastDb: L.harmonicContrastDb,
    hScore: L.harmonicScore, track,
    l: spec.bandLowRatio, m: spec.bandMidRatio, h: spec.bandHighRatio,
    raw, sm: snap.sm, state: snap.state,
  };
  renderDbg(lastDbg);
}

async function start() {
  el.err.hidden = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1,
      }
    });
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ sampleRate: 16000 });
    await ctx.resume();
    srcNode = ctx.createMediaStreamSource(stream);
    const buf = ctx.createScriptProcessor(1024, 1, 1);
    const silent = ctx.createGain(); silent.gain.value = 0;
    srcNode.connect(buf);
    buf.connect(silent);
    silent.connect(ctx.destination);
    lastT = ctx.currentTime;
    ring.reset();
    tracker.reset();
    persist.state = "CLEAR"; persist.sm = 0; persist.init = false; persist.high = 0; persist.low = 0;
    buf.onaudioprocess = (ev) => {
      if (!running) return;
      const data = ev.inputBuffer.getChannelData(0);
      const ready = ring.push(data);
      const now = ctx.currentTime;
      const dt = Math.max(0.001, now - lastT);
      lastT = now;
      if (!ready) {
        el.dbg.textContent = "täytetään 4096 näytteen bufferia…";
        return;
      }
      analyzeReady(ring.snapshot(), ev.inputBuffer.sampleRate, dt, now);
    };
    proc = buf;
    running = true;
    el.btn.textContent = "Pysäytä";
    el.btn.classList.add("stop");
  } catch (e) {
    el.err.hidden = false;
    el.err.textContent = "Mikki ei auennut: " + (e.message || e);
  }
}
function stop() {
  running = false;
  try { proc && proc.disconnect(); } catch (_) {}
  try { srcNode && srcNode.disconnect(); } catch (_) {}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch (_) {}
  try { ctx && ctx.close(); } catch (_) {}
  proc = srcNode = stream = ctx = null;
  el.btn.textContent = "Käynnistä mikki";
  el.btn.classList.remove("stop");
}
el.btn.addEventListener("click", () => running ? stop() : start());
</script>
</body>
</html>
